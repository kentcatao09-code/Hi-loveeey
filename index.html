<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hi Loveeeee ❤️</title>

<style>
body{
    margin:0;
    background:#000;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    overflow-x:hidden;
}

.container{
    padding:30px;
}

h1{
    color:#ff6fa5;
}

button{
    padding:15px 30px;
    font-size:18px;
    border:none;
    border-radius:30px;
    background:#ff6fa5;
    color:white;
    cursor:pointer;
}

#message{
    display:none;
    max-width:800px;
    margin:auto;
    text-align:left;
    line-height:1.8;
    white-space:pre-wrap;
}

.heart{
    position:fixed;
    bottom:-20px;
    animation:float 8s linear forwards;
}

@keyframes float{
    from{
        transform:translateY(0);
        opacity:1;
    }
    to{
        transform:translateY(-100vh);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>Hi Loveeeee ❤️</h1>

<button onclick="openSurprise()">
Open My Surprise ❤️
</button>

<br><br>

<audio id="music" loop>
<source src="d4vd - Here With Me (Lyrics) (1).mp3" type="audio/mpeg">
</audio>

<div id="message">


</div>

</div>

<script>

function openSurprise(){

document.getElementById("message").style.display="block";

document.getElementById("music").play();

setInterval(function(){

let heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=(20+Math.random()*20)+"px";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},8000);

},500);

}

</script>

</body>
</html>
